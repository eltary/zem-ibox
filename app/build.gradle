plugins { id 'com.android.application' }
def allowDestructiveActions = providers.gradleProperty('roadlink.allowDestructiveActions').getOrElse('false').equalsIgnoreCase('true')
android {
    enableKotlin = false
    namespace 'io.zem.ibox'
    compileSdk 36
    defaultConfig {
        applicationId 'io.zem.ibox'
        minSdk 30
        targetSdk 36
        versionCode 16
        versionName '0.0.11'
        buildConfigField 'boolean', 'ALLOW_DESTRUCTIVE_ACTIONS', allowDestructiveActions.toString()
        testInstrumentationRunner 'io.zem.ibox.SmokeTest'
    }
    buildFeatures { buildConfig true }
    defaultConfig { ndk { abiFilters.addAll((providers.gradleProperty('zem.abis').getOrElse('arm64-v8a,armeabi-v7a')).split(',') as List) } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
apply from: new File(System.getProperty('user.home'), 'zem-android-sign/zem-signing.gradle')

dependencies { implementation 'org.videolan.android:libvlc-all:3.7.7' }
